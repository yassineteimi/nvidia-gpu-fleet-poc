name: ci
on:
  push: { branches: [main] }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with: { python-version: 3.x }
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with: { key: "mkdocs-material-${{ env.cache_id }}", path: .cache, restore-keys: "mkdocs-material-" }
      - run: pip install -r requirements.txt
      - run: mkdocs gh-deploy --force

  # The GPU alert rules and their unit tests, with the same promtool version as
  # the Prometheus that kube-prometheus-stack 91.4.1 deploys. A separate job, so
  # a failing rule test is visible on its own and does not hold up the site.
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool 3.14.0
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz \
            | tar xz -C /tmp
          echo "/tmp/prometheus-3.14.0.linux-amd64" >> "$GITHUB_PATH"
      - run: ./scripts/test-rules.sh
