# Builds the goodput trainer image for linux/amd64 and pushes it to ghcr.io.
# The digest it prints is what workloads/goodput/job.yaml pins.
name: trainer-image
on:
  push:
    branches: [main]
    paths:
      - workloads/goodput/**
      - "!workloads/goodput/job.yaml"
      - .github/workflows/trainer-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # No image for code whose tests fail.
      - run: pip install -r requirements-dev.txt && python -m pytest -q
        working-directory: workloads/goodput
      # The PyTorch base is about 4 GB compressed. Clear the toolchains this
      # job doesn't use so the runner has room to build and push it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: workloads/goodput
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/yassineteimi/goodput-trainer:sha-${{ github.sha }}
            ghcr.io/yassineteimi/goodput-trainer:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Digest to pin
        run: |
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"
          echo "Pin in workloads/goodput/job.yaml: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
