# Garage v2.4.1, one node. Every key is from Garage's configuration reference
# at that tag, and this exact file was run against the v2.4.1 binary before it
# was committed. The RPC secret and the default key come from environment
# variables filled from a Secret the bootstrap Job generates in the cluster.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
root_domain = ".s3.garage.local"

[admin]
api_bind_addr = "0.0.0.0:3903"
