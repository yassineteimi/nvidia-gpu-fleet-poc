# Exactly what remediator/kube.py calls, and nothing else: read and patch nodes
# (cordon and annotations), list pods by node, evict pods, write Events. No
# delete on pods, so the controller can't go around a PodDisruptionBudget, and
# no write on nodes/status, so it can't clear the condition that tells it a GPU
# is broken.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-remediator
  namespace: gpu-remediator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-remediator
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-remediator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-remediator
subjects:
  - kind: ServiceAccount
    name: gpu-remediator
    namespace: gpu-remediator
