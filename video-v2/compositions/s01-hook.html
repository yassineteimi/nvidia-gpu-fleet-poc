<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s01-root {
          position: absolute;
          inset: 0;
        }
        #s01-grid {
          position: absolute;
          left: 80px;
          top: 150px;
          display: grid;
          grid-template-columns: repeat(12, 60px);
          grid-auto-rows: 60px;
          gap: 16px;
        }
        #s01-grid .gpu {
          display: block;
          width: 60px;
          height: 60px;
          border-radius: 14px;
          background: var(--green);
          will-change: transform, opacity;
        }
        #s01-grid .gpu.bad {
          position: relative;
        }
        #s01-label {
          position: absolute;
          left: 80px;
          top: 76px;
          font-family: var(--mono);
          font-size: 26px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--muted);
        }
        #s01-states {
          position: relative;
          display: inline-block;
        }
        #s01-stop {
          position: absolute;
          left: 0;
          top: 0;
          opacity: 0;
        }
        #s01-label .live {
          color: var(--green);
        }
        #s01-label .stopped {
          color: var(--red);
        }
        #s01-text {
          position: absolute;
          left: 80px;
          right: 80px;
          bottom: 120px;
        }
        #s01-l1,
        #s01-l2 {
          display: block;
        }
        #s01-l1,
        #s01-l2 {
          font-size: 84px;
        }
        #s01-l2 {
          margin-top: 14px;
        }
      </style>

      <div id="s01-root" data-composition-id="s01" data-width="1080" data-height="1080">
        <div class="stage" id="s01-stage">
          <div id="s01-label">A training job · <span id="s01-states"><span class="live" id="s01-run">running</span><span class="stopped" id="s01-stop" data-layout-allow-overlap>stopped</span></span></div>
          <div id="s01-grid"></div>
          <div id="s01-text">
            <div class="statement" id="s01-l1">One GPU fails.</div>
            <div class="statement" id="s01-l2">The whole job stops.</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const COLS = 12, ROWS = 6, BAD = 2 * 12 + 7;
          const grid = document.getElementById("s01-grid");
          const cells = [];
          for (let i = 0; i < COLS * ROWS; i++) {
            const c = document.createElement("div");
            c.className = "gpu" + (i === BAD ? " bad" : "");
            grid.appendChild(c);
            cells.push(c);
          }
          const others = cells.filter((_, i) => i !== BAD);
          const bad = cells[BAD];
          const tl = gsap.timeline({ paused: true });

          HF.enter(tl, "#s01-stage", 0);
          // Grid arrives as one wave from the top-left corner.
          tl.fromTo(cells, { opacity: 0, scale: 0.6 }, {
            opacity: 1, scale: 1, duration: 0.6, ease: HF.smooth,
            stagger: { each: 0.006, from: "start" },
          }, 0.05);
          // Lockstep: every GPU breathes together, the visual of synchronous training.
          tl.fromTo(cells, { opacity: 1 }, {
            opacity: 0.55, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1,
          }, 0.75);
          // Headline line 1.
          tl.fromTo("#s01-l1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 0.4);
          // The failure: one cell turns red and lifts slightly toward the viewer.
          tl.to(bad, { backgroundColor: "#ff6f61", scale: 1.18, duration: 0.35, ease: HF.smooth }, 1.75);
          // Everything else freezes and greys out, as one beat.
          tl.to(others, { backgroundColor: "#3a403a", opacity: 1, duration: 0.6, ease: HF.smooth }, 2.15);
          tl.fromTo("#s01-run", { opacity: 1 }, { opacity: 0, duration: 0.25 }, 2.15);
          tl.fromTo("#s01-stop", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 2.15);
          tl.fromTo("#s01-l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 2.3);
          tl.to("#s01-l1", { color: "#a3ab9f", duration: 0.5, ease: HF.smooth }, 2.3);

          HF.exit(tl, "#s01-stage", 4.6);
          window.__timelines["s01"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
