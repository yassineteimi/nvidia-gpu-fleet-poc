<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s04-root {
          position: absolute;
          inset: 0;
        }
        #s04-label {
          position: absolute;
          left: 80px;
          top: 76px;
          font-family: var(--mono);
          font-size: 26px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--muted);
        }
        #s04-ring {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1080px;
        }
        #s04-center {
          position: absolute;
          left: 340px;
          top: 500px;
          width: 400px;
          text-align: center;
        }
        #s04-center .a {
          font-weight: 900;
          font-size: 60px;
          letter-spacing: -0.03em;
          line-height: 1;
        }
        #s04-center .b {
          margin-top: 10px;
          font-weight: 700;
          font-size: 40px;
          letter-spacing: -0.02em;
          color: var(--muted);
        }
        .s04-node {
          position: absolute;
          width: 290px;
          height: 80px;
          margin-left: -145px;
          margin-top: -40px;
          display: flex;
          align-items: center;
          gap: 16px;
          padding: 0 26px;
          border-radius: 999px;
          font-weight: 700;
          font-size: 29px;
          white-space: nowrap;
          letter-spacing: -0.01em;
          color: var(--fg);
        }
        .s04-node .dot {
          display: block;
          flex: 0 0 18px;
          width: 18px;
          height: 18px;
          border-radius: 50%;
        }
        #s04-runner {
          position: absolute;
          left: 0;
          top: 0;
          width: 22px;
          height: 22px;
          margin-left: -11px;
          margin-top: -11px;
          border-radius: 50%;
          background: var(--fg);
          box-shadow: 0 0 24px rgba(242, 245, 238, 0.6);
        }
        #s04-key {
          position: absolute;
          left: 80px;
          bottom: 64px;
          display: flex;
          gap: 28px;
          font-family: var(--mono);
          font-size: 24px;
          color: var(--muted);
        }
        #s04-key span {
          display: flex;
          align-items: center;
          gap: 10px;
        }
        #s04-key i {
          display: block;
          width: 16px;
          height: 16px;
          border-radius: 50%;
        }
      </style>

      <div id="s04-root" data-composition-id="s04" data-width="1080" data-height="1080">
        <div class="stage" id="s04-stage">
          <div id="s04-label">The work, as a loop</div>
          <svg id="s04-ring" viewBox="0 0 1080 1080">
            <ellipse id="s04-ellipse" cx="540" cy="560" rx="330" ry="260" fill="none" stroke="rgba(242,245,238,0.28)" stroke-width="3"></ellipse>
          </svg>
          <div id="s04-center">
            <div class="a">A GPU's life</div>
            <div class="b">in a fleet</div>
          </div>
          <div id="s04-runner"></div>
          <div id="s04-nodes"></div>
          <div id="s04-key">
            <span><i style="background: #76b900"></i>Session A</span>
            <span><i style="background: #6fa8dc"></i>B</span>
            <span><i style="background: #f6b26b"></i>C</span>
            <span><i style="background: #b4a7d6"></i>D</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const CX = 540, CY = 560, RX = 330, RY = 260;
          const steps = [
            ["Accept", "#b4a7d6"],
            ["Bring online", "#76b900"],
            ["Share and run", "#b4a7d6"],
            ["Watch", "#6fa8dc"],
            ["Isolate", "#f6b26b"],
            ["Return", "#7d8679"],
          ];
          const host = document.getElementById("s04-nodes");
          const nodes = steps.map(([name, color], i) => {
            const a = ((-90 + i * 60) * Math.PI) / 180;
            const n = document.createElement("div");
            n.className = "s04-node glass";
            n.style.left = CX + RX * Math.cos(a) + "px";
            n.style.top = CY + RY * Math.sin(a) + "px";
            n.innerHTML = '<i class="dot" style="background:' + color + '"></i>' + name;
            n.dataset.color = color;
            host.appendChild(n);
            return n;
          });

          const ellipse = document.getElementById("s04-ellipse");
          const len = 2 * Math.PI * Math.sqrt((RX * RX + RY * RY) / 2);
          ellipse.setAttribute("stroke-dasharray", String(len));

          const tl = gsap.timeline({ paused: true });
          HF.enter(tl, "#s04-stage", 0);
          tl.fromTo(ellipse, { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.3, ease: HF.smooth }, 0.15);
          tl.fromTo("#s04-center", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.6, ease: HF.smooth }, 0.3);
          tl.fromTo(nodes, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.55, ease: HF.smooth, stagger: 0.09 }, 0.45);
          tl.fromTo("#s04-key", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.0);

          // A runner travels the loop; each step lights as it passes, in its session colour.
          const runner = document.getElementById("s04-runner");
          const p = { a: -90 };
          const place = () => {
            const a = (p.a * Math.PI) / 180;
            runner.style.transform = "translate(" + (CX + RX * Math.cos(a)) + "px," + (CY + RY * Math.sin(a)) + "px)";
          };
          place();
          tl.fromTo(runner, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.3);
          tl.fromTo(p, { a: -90 }, { a: 270, duration: 3.6, ease: "none", onUpdate: place }, 1.4);
          nodes.forEach((n, i) => {
            const at = 1.4 + i * 0.6;
            tl.to(n, { borderColor: n.dataset.color, scale: 1.08, duration: 0.3, ease: HF.smooth }, at);
            tl.to(n, { borderColor: "rgba(255,255,255,0.10)", scale: 1, duration: 0.5, ease: HF.smooth }, at + 0.45);
          });
          HF.exit(tl, "#s04-stage", 5.6);
          window.__timelines["s04"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
