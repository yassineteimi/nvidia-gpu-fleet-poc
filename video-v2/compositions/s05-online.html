<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s05-root {
          position: absolute;
          inset: 0;
        }
        #s05-code {
          position: absolute;
          left: 80px;
          top: 160px;
          width: 920px;
          height: 250px;
          padding: 30px 40px;
          font-family: var(--mono);
          font-size: 32px;
          line-height: 1.5;
          color: var(--fg);
        }
        #s05-code .path {
          font-size: 24px;
          color: var(--faint);
          margin-bottom: 10px;
        }
        #s05-code .k {
          color: var(--muted);
        }
        #s05-code .v {
          color: var(--green);
          font-weight: 700;
        }
        #s05-typed {
          display: inline-block;
          overflow: hidden;
          white-space: pre;
          vertical-align: bottom;
        }
        #s05-link {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1080px;
        }
        #s05-node {
          position: absolute;
          left: 80px;
          top: 470px;
          width: 920px;
          height: 130px;
          display: flex;
          align-items: center;
          gap: 28px;
          padding: 0 40px;
        }
        #s05-chip {
          display: block;
          width: 64px;
          height: 64px;
          border-radius: 14px;
          border: 4px solid #4b524b;
          background: #1a1e1a;
        }
        #s05-node .title {
          font-weight: 900;
          font-size: 44px;
          letter-spacing: -0.02em;
        }
        #s05-states {
          position: relative;
          margin-left: auto;
          width: 380px;
          height: 40px;
          font-family: var(--mono);
          font-size: 28px;
          font-weight: 700;
          text-align: right;
        }
        #s05-states span {
          position: absolute;
          right: 0;
          top: 0;
        }
        #s05-none {
          color: var(--muted);
        }
        #s05-ok {
          color: var(--green);
          opacity: 0;
        }
        #s05-text {
          position: absolute;
          left: 80px;
          right: 80px;
          bottom: 110px;
        }
        #s05-text .second {
          margin-top: 22px;
        }
      </style>

      <div id="s05-root" data-composition-id="s05" data-width="1080" data-height="1080">
        <div class="stage" id="s05-stage">
          <div class="kicker" style="color: #76b900"><i class="dot" style="background: #76b900"></i>Bring online · Session A</div>
          <div id="s05-code" class="glass">
            <div class="path">gitops/values/gpu-operator.yaml</div>
            <div><span class="k">driver:</span></div>
            <div>&nbsp;&nbsp;<span class="k">version:</span> <span id="s05-typed" class="v">"595.91.07"</span></div>
          </div>
          <svg id="s05-link" viewBox="0 0 1080 1080">
            <line x1="540" y1="412" x2="540" y2="468" stroke="rgba(242,245,238,0.25)" stroke-width="3" stroke-dasharray="6 8"></line>
            <circle id="s05-pulse" cx="540" cy="412" r="9" fill="#76b900"></circle>
          </svg>
          <div id="s05-node" class="glass">
            <i id="s05-chip"></i>
            <div class="title">GPU node</div>
            <div id="s05-states">
              <span id="s05-none">booted with no driver</span>
              <span id="s05-ok">driver 595.91.07 ✓</span>
            </div>
          </div>
          <div id="s05-text">
            <div class="statement">The driver comes from Git.</div>
            <div class="second">Pinned in a commit, installed by the GPU Operator.</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          HF.enter(tl, "#s05-stage", 0);
          tl.fromTo("#s05-code", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 0.1);
          tl.fromTo("#s05-node", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 0.25);
          // The pinned version types itself in, character by character (a clip reveal, seek-safe).
          tl.fromTo("#s05-typed", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "steps(11)" }, 0.6);
          // The commit travels to the node.
          tl.fromTo("#s05-pulse", { attr: { cy: 412 }, opacity: 0 }, { attr: { cy: 468 }, opacity: 1, duration: 0.55, ease: HF.smooth }, 1.6);
          tl.to("#s05-pulse", { opacity: 0, duration: 0.2 }, 2.16);
          // The node comes online: chip lights green, state line swaps.
          tl.to("#s05-chip", { borderColor: "#76b900", backgroundColor: "rgba(118,185,0,0.25)", duration: 0.5, ease: HF.smooth }, 2.15);
          tl.fromTo("#s05-none", { opacity: 1 }, { opacity: 0, duration: 0.25 }, 2.15);
          tl.fromTo("#s05-ok", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: HF.smooth }, 2.25);
          tl.fromTo("#s05-text .statement", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 2.4);
          tl.fromTo("#s05-text .second", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 2.65);
          HF.exit(tl, "#s05-stage", 4.6);
          window.__timelines["s05"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
