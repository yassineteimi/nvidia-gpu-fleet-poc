<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s07-root {
          position: absolute;
          inset: 0;
        }
        #s07-node {
          position: absolute;
          left: 80px;
          top: 160px;
          width: 920px;
          height: 270px;
          padding: 28px 36px;
          overflow: hidden;
        }
        #s07-node .title {
          font-weight: 900;
          font-size: 40px;
          letter-spacing: -0.02em;
        }
        #s07-node .tagline {
          position: absolute;
          right: 36px;
          top: 36px;
          color: var(--orange);
        }
        #s07-jobs {
          position: absolute;
          left: 36px;
          top: 120px;
          display: flex;
          gap: 20px;
        }
        #s07-jobs .job {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 200px;
          height: 110px;
          border-radius: 18px;
          background: rgba(180, 167, 214, 0.22);
          border: 2px solid rgba(180, 167, 214, 0.55);
          font-family: var(--mono);
          font-size: 24px;
          color: var(--fg);
        }
        #s07-tape {
          position: absolute;
          left: -40px;
          top: 112px;
          width: 1000px;
          height: 40px;
          background: repeating-linear-gradient(-45deg, #f6b26b 0 22px, #1b1712 22px 44px);
          transform-origin: 0% 50%;
        }
        #s07-reads {
          position: absolute;
          left: 80px;
          top: 480px;
          width: 920px;
          display: flex;
          gap: 40px;
        }
        #s07-reads .read {
          flex: 1 1 0;
        }
        #s07-reads .v {
          font-weight: 900;
          font-size: 170px;
          line-height: 1;
          letter-spacing: -0.05em;
          color: var(--fg);
        }
        #s07-reads .u {
          font-size: 90px;
          color: var(--orange);
        }
        #s07-reads .l {
          margin-top: 10px;
          font-family: var(--mono);
          font-weight: 700;
          font-size: 28px;
          letter-spacing: 0.04em;
          color: var(--muted);
        }
        #s07-text {
          position: absolute;
          left: 80px;
          right: 80px;
          bottom: 110px;
        }
        #s07-text .statement {
          font-size: 84px;
        }
      </style>

      <div id="s07-root" data-composition-id="s07" data-width="1080" data-height="1080">
        <div class="stage" id="s07-stage">
          <div class="kicker" style="color: #f6b26b"><i class="dot" style="background: #f6b26b"></i>Isolate · Session C</div>
          <div id="s07-node" class="glass">
            <div class="title">GPU node</div>
            <div class="tag tagline">injected fault</div>
            <div id="s07-jobs">
              <div class="job">workload</div>
              <div class="job">workload</div>
              <div class="job">workload</div>
            </div>
            <div id="s07-tape" data-layout-allow-overflow></div>
          </div>
          <div id="s07-reads">
            <div class="read" id="s07-r1">
              <div class="v num"><span id="s07-c1">0.00</span><span class="u"> s</span></div>
              <div class="l">CORDONED</div>
            </div>
            <div class="read" id="s07-r2">
              <div class="v num"><span id="s07-c2">0.0</span><span class="u"> s</span></div>
              <div class="l">DRAINED</div>
            </div>
          </div>
          <div id="s07-text">
            <div class="statement">No human in the loop.</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const jobs = Array.from(document.querySelectorAll("#s07-jobs .job"));
          const tl = gsap.timeline({ paused: true });
          HF.enter(tl, "#s07-stage", 0);
          tl.fromTo("#s07-node", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 0.1);
          tl.fromTo(jobs, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: HF.smooth, stagger: 0.08 }, 0.3);
          tl.fromTo(".tagline", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6);
          // Cordon: the tape snaps across in one quick stroke, and the node's edge turns orange.
          tl.fromTo("#s07-tape", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: HF.smooth }, 1.0);
          tl.to("#s07-node", { borderColor: "#f6b26b", duration: 0.3 }, 1.0);
          tl.fromTo("#s07-r1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: HF.smooth }, 1.0);
          HF.count(tl, document.getElementById("s07-c1"), 0, 0.12, 1.0, 0.4, { decimals: 2 });
          // Drain: workloads leave the node to the right, the first one pushing the rest.
          jobs.slice().reverse().forEach((j, i) => {
            tl.to(j, { x: 760, opacity: 0, duration: 0.7, ease: "power2.in" }, 1.7 + i * 0.12);
          });
          tl.fromTo("#s07-r2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: HF.smooth }, 1.7);
          HF.count(tl, document.getElementById("s07-c2"), 0, 2.5, 1.7, 1.0, { decimals: 1 });
          tl.fromTo("#s07-text", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 2.9);
          HF.exit(tl, "#s07-stage", 5.6);
          window.__timelines["s07"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
