      <div id="s08-root" data-composition-id="s08" data-width="1080" data-height="1080">
        <div class="stage" id="s08-stage">
          <div class="kicker" style="color: #b4a7d6"><i class="dot" style="background: #b4a7d6"></i>Share · Session D</div>

            <div class="s08-slice glass" id="s08-s3" style="left: 705px"><span class="n">4/4</span></div>
            <div class="s08-pod s08-a" id="s08-p0" style="left: 18px; right: auto; width: 179px">team A</div>
            <div class="s08-pod s08-a" id="s08-p1" style="left: 253px; right: auto; width: 179px">team A</div>
            <div class="s08-pod s08-b" id="s08-p2" style="left: 488px; right: auto; width: 179px">team B</div>

            <div class="second">Each team gets a quota, and the cluster enforces it.</div>

      <script>
        (function () {
          const slices = ["#s08-s0", "#s08-s1", "#s08-s2", "#s08-s3"];
          // Where each slice sits relative to the whole card's centre, for the split.
          const offs = [0, 235, 470, 705].map((l) => 460 - (l + 107.5));
          const tl = gsap.timeline({ paused: true });
          HF.enter(tl, "#s08-stage", 0);
          tl.fromTo("#s08-commit", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: HF.smooth }, 0.15);
          tl.fromTo("#s08-whole", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: HF.smooth }, 0.1);
          tl.fromTo("#s08-t", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6);
          // The split: slices emerge from the card's centre and spread out, a small spring
          // overshoot because this is the one gesture in the film that carries momentum.
          tl.to("#s08-whole", { opacity: 0, scale: 1.02, duration: 0.3, ease: "power2.in" }, 0.95);
          slices.forEach((s, i) => {
            tl.fromTo(s, { x: offs[i], opacity: 0, scale: 0.92 }, { x: 0, opacity: 1, scale: 1, duration: 0.8, ease: HF.momentum }, 1.0);
          });
          tl.fromTo("#s08-text .statement", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 1.3);
          // Teams fill their slices.
          ["#s08-p0", "#s08-p1", "#s08-p2"].forEach((p, i) => {
            tl.fromTo(p, { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.55, ease: HF.smooth }, 1.9 + i * 0.18);
          });
          // Team A tries for a third. It drops toward the free slice and is refused:
          // a short horizontal shake, like a wrong password, then it lifts away red.
          tl.fromTo("#s08-pod-x", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.4, ease: HF.smooth }, 2.75);
          tl.to("#s08-pod-x", { y: 210, duration: 0.45, ease: "power2.in" }, 3.15);
          tl.to("#s08-pod-x", { y: 150, backgroundColor: "#ff6f61", duration: 0.3, ease: HF.smooth }, 3.6);
          tl.to("#s08-pod-x", { keyframes: { x: [0, -22, 18, -12, 7, 0] }, duration: 0.5, ease: "none" }, 3.65);
          tl.fromTo("#s08-refused", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: HF.smooth }, 3.7);
          tl.to("#s08-pod-x", { y: 0, opacity: 0.6, duration: 0.6, ease: HF.smooth }, 4.2);
          tl.fromTo("#s08-text .second", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 3.7);
          HF.exit(tl, "#s08-stage", 5.6);
          window.__timelines["s08"] = tl;
        })();
      </script>
