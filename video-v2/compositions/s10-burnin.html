<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s10-root {
          position: absolute;
          inset: 0;
        }
        #s10-card {
          position: absolute;
          left: 80px;
          top: 150px;
          width: 920px;
          height: 440px;
        }
        #s10-chart {
          position: absolute;
          inset: 0;
          width: 920px;
          height: 440px;
          overflow: visible;
        }
        #s10-chart text {
          font-family: "JetBrains Mono", monospace;
          font-size: 24px;
          fill: #7d8679;
        }
        #s10-read {
          position: absolute;
          left: 0;
          top: 0;
          padding: 6px 14px;
          border-radius: 12px;
          background: rgba(11, 14, 12, 0.85);
          border: 2px solid var(--purple);
          font-family: var(--mono);
          font-weight: 700;
          font-size: 28px;
          color: var(--fg);
          white-space: nowrap;
        }
        #s10-text {
          position: absolute;
          left: 80px;
          right: 80px;
          bottom: 110px;
        }
        #s10-text .second {
          margin-top: 20px;
        }
      </style>

      <div id="s10-root" data-composition-id="s10" data-width="1080" data-height="1080">
        <div class="stage" id="s10-stage">
          <div class="kicker" style="color: #b4a7d6"><i class="dot" style="background: #b4a7d6"></i>Accept · Session D</div>
          <div id="s10-card" class="glass">
            <svg id="s10-chart" viewBox="0 0 920 440">
              <line x1="90" y1="70" x2="880" y2="70" stroke="rgba(255,255,255,0.08)" stroke-width="2"></line>
              <line x1="90" y1="370" x2="880" y2="370" stroke="rgba(255,255,255,0.16)" stroke-width="2"></line>
              <text x="24" y="78">70°</text>
              <text x="24" y="378">40°</text>
              <text x="90" y="415">0 h</text>
              <text x="880" y="415" text-anchor="end">3 h</text>
              <polyline id="s10-line" fill="none" stroke="#b4a7d6" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"></polyline>
            </svg>
            <div id="s10-read" class="num"><span id="s10-v">44</span> °C</div>
          </div>
          <div id="s10-text">
            <div class="statement">3 hours at full load.</div>
            <div class="second">Flat at 65 °C. No thermal throttling, no errors.</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // docs/artifacts/session-d-burn-in.txt: GPU temperature every 10 minutes.
          const temps = [44, 64, 64, 64, 64, 64, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65];
          const X0 = 90, X1 = 880, Y70 = 70, Y40 = 370;
          const px = (i) => X0 + (i * (X1 - X0)) / (temps.length - 1);
          const py = (t) => Y40 - ((t - 40) / 30) * (Y40 - Y70);
          const pts = temps.map((t, i) => [px(i), py(t)]);
          const line = document.getElementById("s10-line");
          line.setAttribute("points", pts.map((p) => p.join(",")).join(" "));
          let len = 0;
          for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
          line.setAttribute("stroke-dasharray", String(len));

          // The readout rides the tip of the line: position by progress along x.
          const read = document.getElementById("s10-read");
          const v = document.getElementById("s10-v");
          const prog = { p: 0 };
          const place = () => {
            const f = prog.p * (temps.length - 1);
            const i = Math.min(Math.floor(f), temps.length - 2);
            const k = f - i;
            const x = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k;
            const y = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k;
            const t = temps[i] + (temps[i + 1] - temps[i]) * k;
            v.textContent = String(Math.round(t));
            read.style.transform = "translate(" + Math.min(x - 70, 760) + "px," + (y - 78) + "px)";
          };
          place();

          const tl = gsap.timeline({ paused: true });
          HF.enter(tl, "#s10-stage", 0);
          tl.fromTo("#s10-card", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 0.1);
          tl.fromTo(line, { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 2.4, ease: "power1.inOut" }, 0.45);
          tl.fromTo(prog, { p: 0 }, { p: 1, duration: 2.4, ease: "power1.inOut", onUpdate: place }, 0.45);
          tl.fromTo(read, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.45);
          tl.fromTo("#s10-text .statement", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 0.6);
          tl.fromTo("#s10-text .second", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 2.6);
          HF.exit(tl, "#s10-stage", 4.6);
          window.__timelines["s10"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
