<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s11-root {
          position: absolute;
          inset: 0;
        }
        #s11-bloom {
          position: absolute;
          left: -160px;
          top: 160px;
          width: 900px;
          height: 700px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(118, 185, 0, 0.22), rgba(118, 185, 0, 0));
        }
        #s11-block {
          position: absolute;
          left: 80px;
          right: 80px;
          top: 360px;
        }
        #s11-name {
          font-weight: 900;
          font-size: 120px;
          line-height: 1;
          letter-spacing: -0.035em;
        }
        #s11-rule {
          display: block;
          width: 120px;
          height: 6px;
          margin: 40px 0 34px;
          border-radius: 3px;
          background: var(--green);
          transform-origin: 0% 50%;
        }
        #s11-url {
          margin-top: 36px;
          font-family: var(--mono);
          font-weight: 700;
          font-size: 32px;
          color: var(--green);
        }
      </style>

      <div id="s11-root" data-composition-id="s11" data-width="1080" data-height="1080">
        <div class="stage" id="s11-stage">
          <div id="s11-bloom"></div>
          <div id="s11-block">
            <div id="s11-name">Yassine Teimi</div>
            <i id="s11-rule"></i>
            <div class="second" id="s11-line">Every number links to captured output.</div>
            <div id="s11-url">yassineteimi.github.io/nvidia-gpu-fleet-poc</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          HF.enter(tl, "#s11-stage", 0);
          tl.fromTo("#s11-bloom", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 1.4, ease: HF.smooth }, 0);
          tl.fromTo("#s11-name", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: HF.smooth }, 0.3);
          tl.fromTo("#s11-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: HF.smooth }, 0.7);
          tl.fromTo("#s11-line", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 1.6);
          tl.fromTo("#s11-url", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: HF.smooth }, 2.0);
          // Last frame holds: no exit, the URL stays readable to the end.
          window.__timelines["s11"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
